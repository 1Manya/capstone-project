# ============================================================
# config.yaml — Single source of truth for all parameters
# Edit ONLY this file to change anything about the pipeline
# ============================================================

# ----- PATHS ------------------------------------------------
paths:
  clean_base:       "data/clean_base"          # Put KITTI/nuScenes images here
  final_dataset:    "data/final_dataset"        # Auto-generated
  checkpoints:      "checkpoints"
  logs:             "logs"
  results:          "results"

# ----- DATASET GENERATION -----------------------------------
dataset:
  image_size:       224                         # Resize all images to 224x224
  train_split:      0.70
  val_split:        0.15
  test_split:       0.15
  seed:             42
  max_images:       7500                        # Max clean images to use
                                                # (matched 1:1 by corrupted)

  # 6 attack variation profiles — grounded in research papers
  variations:
    freq_low_narrow:
      freq_range:   [3, 5]
      width_range:  [1, 1]
      intensity_range: [200, 220]
      angle:        0
      coverage:     1.0
      noise_sigma:  5
      description:  "Dense thin stripes — aggressive attack (Köhler 2021)"

    freq_low_wide:
      freq_range:   [3, 5]
      width_range:  [3, 4]
      intensity_range: [180, 200]
      angle:        0
      coverage:     1.0
      noise_sigma:  7
      description:  "Dense thick stripes — Stein 2025 duty cycle"

    freq_mid_narrow:
      freq_range:   [6, 8]
      width_range:  [1, 2]
      intensity_range: [160, 190]
      angle:        0
      coverage:     0.85
      noise_sigma:  6
      description:  "Medium spacing, partial coverage (Köhler aiming precision)"

    freq_mid_wide:
      freq_range:   [6, 8]
      width_range:  [3, 4]
      intensity_range: [170, 200]
      angle:        0
      coverage:     0.75
      noise_sigma:  8
      description:  "Medium spacing thick stripes — Stein 2025"

    freq_high_narrow:
      freq_range:   [9, 12]
      width_range:  [1, 1]
      intensity_range: [150, 175]
      angle:        0
      coverage:     0.80
      noise_sigma:  5
      description:  "Sparse dim stripes — concealment mode (Stein 2025)"

    freq_high_angled:
      freq_range:   [6, 10]
      width_range:  [2, 3]
      intensity_range: [160, 190]
      angle_range:  [15, 25]
      coverage:     0.80
      noise_sigma:  7
      description:  "Angled stripes — Köhler 2021 angle factor"

# ----- MODEL ------------------------------------------------
model:
  backbone:         "resnet18"                  # resnet18 | resnet34 | efficientnet_b0
  pretrained:       true
  dropout:          0.3
  num_classes:      2                           # binary: clean / attacked

# ----- TRAINING ---------------------------------------------
training:
  epochs:           30
  batch_size:       32
  learning_rate:    0.0003
  weight_decay:     0.0001
  patience:         7                           # early stopping patience
  scheduler:        "cosine"                    # cosine | step | plateau
  loss:             "focal"                     # focal | crossentropy
  focal_gamma:      2.0
  focal_alpha:      0.25
  num_workers:      4
  pin_memory:       true
  amp:              true                        # mixed precision (faster on GPU)

# ----- ENSEMBLE ---------------------------------------------
ensemble:
  strategy:         "average"                   # average | weighted | majority_vote
  # One specialist CNN is trained per variation profile
  # Weights can be tuned post-training based on val F1

# ----- EVALUATION -------------------------------------------
evaluation:
  metrics:          ["f1", "auc", "accuracy", "precision", "recall"]
  threshold:        0.5
  per_variation:    true                        # show breakdown per attack type
